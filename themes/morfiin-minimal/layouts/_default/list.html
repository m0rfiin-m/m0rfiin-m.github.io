{{ define "main" }}
<div class="container">
    <div class="intro">
        <span class="intro-label">{{ $.Site.Params.program }} &middot; {{ $.Site.Params.school }}</span>
        <h1>{{ .Title }}</h1>
    </div>

    <div class="posts-header">{{ len .Pages }} {{ if eq (len .Pages) 1 }}entry{{ else }}entries{{ end }}</div>
    <div class="posts">
        {{ range .Pages }}
        {{ partial "post-preview.html" . }}
        {{ end }}
    </div>
</div>
{{ end }}
