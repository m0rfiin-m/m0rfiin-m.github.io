<header>
    <div class="container">
        <a href="{{ .Site.BaseURL }}" class="site-brand">
            <span class="site-title">m0rfiin</span>
            <span class="site-subtitle">Community ops, esports strategy, and entertainment business</span>
        </a>

        {{ $current := . }}
        <nav>
            {{ range .Site.Menus.main }}
            {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
            <a href="{{ .URL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>
    </div>
</header>
